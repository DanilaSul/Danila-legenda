<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuestHouse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --text:var(--tg-theme-text-color,#14161a);
  --hint:var(--tg-theme-hint-color,#8a8f99);
  --accent:var(--tg-theme-button-color,#3478f6);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --danger:#e5484d; --ok:#22a861; --warn:#e8a01a;
  --line:rgba(128,128,128,.16);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
.i.s{width:16px;height:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:12px 16px 4px}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:18px 4px 8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--hint)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-behavior:smooth}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:48px;text-align:center;padding:7px 0 5px;border-radius:14px;background:var(--bg);font-size:11px;color:var(--hint);border:0;position:relative;transition:background .15s,transform .1s}
.day b{display:block;font-size:18px;color:var(--text);font-weight:700}
.day.on{background:var(--accent);color:var(--accent-text)}
.day.on b{color:var(--accent-text)}
.day.today:not(.on) b{color:var(--accent)}
.day i{display:block;height:4px;width:4px;border-radius:50%;margin:3px auto 0}
.day i.has{background:var(--ok)} .day.on i.has{background:var(--accent-text)}
.day:active,.tile:active,.card.tap:active,.chip:active,.btn:active{transform:scale(.97)}
main{padding:0 16px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--bg);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;transition:transform .1s}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--hint);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;border:0;background:var(--bg);font-size:14px;font-weight:500;transition:background .15s,color .15s,transform .1s}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--text);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border:0;border-radius:14px;background:var(--bg);padding:10px 10px 9px;text-align:left;min-height:62px;transition:transform .1s,background .15s;border-left:4px solid transparent}
.tile .t{font-weight:700;font-size:16px}
.tile .n{font-size:12px;color:var(--hint);margin-top:2px}
.tile.busy{border-left-color:var(--qc,var(--ok))}
.tile.busy .n{color:var(--text);font-weight:500}
.tile.free .n{display:flex;align-items:center;gap:3px;color:var(--accent)}
.bk{display:flex;gap:12px;align-items:stretch}
.bk .bar{width:4px;border-radius:4px;background:var(--qc)}
.bk .tm{font-weight:800;font-size:17px;min-width:50px}
.price{font-weight:700;white-space:nowrap}
.old{text-decoration:line-through;color:var(--hint);font-size:12px;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg2);color:var(--hint);white-space:nowrap}
.b-ok{background:rgba(52,120,246,.13);color:var(--accent)}
.b-done{background:rgba(34,168,97,.14);color:var(--ok)}
.b-cancel{background:rgba(229,72,77,.12);color:var(--danger)}
.b-disc{background:rgba(232,160,26,.15);color:var(--warn)}
.cancelled{opacity:.5}
.empty{text-align:center;color:var(--hint);padding:26px 0 10px}
label{display:block;font-size:12px;font-weight:500;color:var(--hint);margin:12px 2px 5px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid transparent;background:var(--bg2);color:var(--text);font:inherit;font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hint);transition:background .15s,color .15s}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:15px;margin-top:12px;transition:transform .1s,opacity .15s}
.btn.ghost{background:var(--bg);color:var(--accent)}
.btn.soft{background:var(--bg2);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--hint);font-size:11px;font-weight:500;padding:4px 0;transition:color .15s}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-text);box-shadow:0 6px 20px rgba(52,120,246,.35);z-index:9;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab .i{width:26px;height:26px;stroke-width:2.4}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden;will-change:transform}
.sheet.open{transform:none;visibility:visible}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h3{flex:1;margin:0;font-size:19px}
.x{border:0;background:var(--bg2);color:var(--hint);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sum:last-child{border:0}
.sum.sub{padding-left:14px;font-size:14px;color:var(--hint)}
.sum.sub b{color:var(--text);font-weight:600}
.big{font-size:22px;font-weight:800}
.in{color:var(--ok)}.out{color:var(--danger)}
.qhead{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.qhead .dot,.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.total-card{background:var(--text);color:var(--bg)}
.total-card .muted{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.total-card .sum{border-color:color-mix(in srgb,var(--bg) 18%,transparent)}
.list-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.list-item input{flex:1}
.del{border:0;background:var(--bg2);color:var(--danger);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qset{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:10px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:rgba(20,22,26,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;gap:6px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>

  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>

<header>
  <div class="top"><h1 class="grow" id="title">Брони</h1><span class="pill" id="sync"></span></div>
  <div class="days" id="days"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="new"><svg class="i"><use href="#i-plus"/></svg></button>
<nav>
  <button data-tab="bookings" class="on"><svg class="i"><use href="#i-cal"/></svg>Брони</button>
  <button data-tab="cash"><svg class="i"><use href="#i-wallet"/></svg>Касса</button>
  <button data-tab="settings"><svg class="i"><use href="#i-sliders"/></svg>Настройки</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input id="dpick" type="date" style="position:fixed;left:-100px;opacity:0">

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); }catch(_){} }
const $ = id => document.getElementById(id);
const ic = (n,c='') => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;

/* ================= Хранилище =================
   Всё держим в памяти, рисуем мгновенно, а в облако Telegram сохраняем в фоне. */
const useCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
const cloud = {
  get:k=>new Promise(r=>{ if(useCloud) tg.CloudStorage.getItem(k,(e,v)=>r(e||!v?null:JSON.parse(v))); else { try{const v=localStorage.getItem(k);r(v?JSON.parse(v):null)}catch(_){r(null)} } }),
  getMany:keys=>new Promise(r=>{ if(!keys.length) return r({});
    if(useCloud) tg.CloudStorage.getItems(keys,(e,v)=>{ const o={}; if(!e&&v) for(const k in v) if(v[k]) try{o[k]=JSON.parse(v[k])}catch(_){} r(o); });
    else { const o={}; keys.forEach(k=>{try{const v=localStorage.getItem(k); if(v) o[k]=JSON.parse(v)}catch(_){}}); r(o); } }),
  set:(k,v)=>new Promise(r=>{ const s=JSON.stringify(v); if(useCloud) tg.CloudStorage.setItem(k,s,e=>{ if(e) toast('Ошибка сохранения','x'); r(!e)}); else { try{localStorage.setItem(k,s)}catch(_){} r(true)} }),
  keys:()=>new Promise(r=>{ if(useCloud) tg.CloudStorage.getKeys((e,k)=>r(e?[]:k)); else { try{r(Object.keys(localStorage))}catch(_){r([])} } })
};
const pending={};
function persist(k,v){ clearTimeout(pending[k]); pending[k]=setTimeout(()=>cloud.set(k,v),250); }

/* ================= Настройки по умолчанию ================= */
const QUEST_COLORS=['#e5484d','#e8a01a','#8e4ec6','#22a861','#3478f6','#0fa3b1'];
const DEFAULT_SETTINGS = {
  v:2,
  quests:[
    {name:'Hell House 2',     price:500000, actors:30000, color:'#e5484d'},
    {name:'Катакомбы',        price:500000, actors:30000, color:'#e8a01a'},
    {name:'Подземелье',       price:400000, actors:0,     color:'#8e4ec6'},
    {name:'Каникулы бабушки', price:400000, actors:0,     color:'#22a861'}
  ],
  slots:['10:00','11:30','13:00','14:30','16:00','17:30','19:00','20:30','22:00'],
  defaultGuests:4,
  mgmt:[{name:'Данил',pct:10},{name:'Амир',pct:5}],
  ownerName:'Расова',
  payFields:['Наличные','Карта','Перевод'],
  expenseFields:['Расходы'],
  admin:''
};
const STATUSES={new:'Новая',ok:'Подтверждена',done:'Прошла',cancel:'Отмена'};
const STATUS_CLS={new:'',ok:'b-ok',done:'b-done',cancel:'b-cancel'};

let S={tab:'bookings',date:today(),quest:'*',cashMode:'day',settings:clone(DEFAULT_SETTINGS),bookings:{},reports:{}};

/* ================= Утилиты ================= */
function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){return fmtDate(new Date())}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function human(s){return parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}
function monthName(s){const t=parseDate(s).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});return t[0].toUpperCase()+t.slice(1)}
function money(n){return Math.round(+n||0).toLocaleString('ru-RU')+' сум'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function haptic(t='light'){try{tg.HapticFeedback.impactOccurred(t)}catch(_){}}
function hapticOk(){try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}}
function toast(t,icon='check'){const el=$('toast');el.innerHTML=ic(icon,'s')+esc(t);el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}
const quest = name => S.settings.quests.find(q=>q.name===name) || {name,price:0,actors:0,color:'#8a8f99'};
const dayList = d => S.bookings[d] || (S.bookings[d]=[]);
function finalPrice(b){ const p=+b.price||0, d=+b.discount||0; const off=b.discType==='pct'?p*d/100:d; return Math.max(0,Math.round(p-off)); }
function saveDay(d){ persist('b_'+d, dayList(d)); }

/* ================= Лента дней ================= */
function renderDays(){
  const base=new Date(); base.setDate(base.getDate()-7); const t=today(); let h='';
  for(let i=0;i<45;i++){
    const d=new Date(base); d.setDate(base.getDate()+i); const k=fmtDate(d);
    const has=(S.bookings[k]||[]).some(b=>b.status!=='cancel');
    h+=`<button class="day ${k===S.date?'on':''} ${k===t?'today':''}" data-d="${k}">${d.toLocaleDateString('ru-RU',{weekday:'short'})}<b>${d.getDate()}</b><i class="${has?'has':''}"></i></button>`;
  }
  h+=`<button class="day" data-act="pickdate" style="color:var(--accent)">${ic('cal')}<span style="display:block;font-size:11px;margin-top:2px">дата</span></button>`;
  $('days').innerHTML=h;
  const on=$('days').querySelector('.on'); if(on){ const box=$('days'); box.style.scrollBehavior='auto'; box.scrollLeft=on.offsetLeft-box.clientWidth/2+24; box.style.scrollBehavior=''; }
}
function setDate(d){ if(!d) return; S.date=d; haptic(); $('days').querySelectorAll('.day').forEach(b=>b.classList.toggle('on',b.dataset.d===d)); if(!$('days').querySelector('.on')) renderDays(); render(); }

/* ================= Навигация ================= */
function go(tab){
  if(S.tab===tab) return; S.tab=tab; haptic();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('title').textContent={bookings:'Брони',cash:'Касса',settings:'Настройки'}[tab];
  $('days').style.display=tab==='settings'?'none':'flex';
  $('fab').style.display=tab==='bookings'?'flex':'none';
  render(); window.scrollTo(0,0);
}
function render(){
  const v=$('view');
  v.innerHTML=`<div class="view">${S.tab==='bookings'?viewBookings():S.tab==='cash'?viewCash():viewSettings()}</div>`;
  if(S.tab==='cash') calcCash();
}

/* ================= Брони ================= */
function viewBookings(){
  const st=S.settings, all=dayList(S.date);
  const list=all.filter(b=>S.quest==='*'||b.quest===S.quest).sort((a,b)=>a.time.localeCompare(b.time)||a.quest.localeCompare(b.quest));
  let h=`<div class="chips"><button class="chip ${S.quest==='*'?'on':''}" data-q="*">Все</button>`+
    st.quests.map(q=>`<button class="chip ${S.quest===q.name?'on':''}" data-q="${esc(q.name)}"><span class="dot" style="background:${q.color}"></span>${esc(q.name)}</button>`).join('')+`</div>`;
  if(S.quest!=='*'){
    const q=quest(S.quest);
    h+=`<div class="tiles">`+st.slots.map(t=>{
      const b=all.find(x=>x.time===t&&x.quest===q.name&&x.status!=='cancel');
      return b? `<button class="tile busy" style="--qc:${q.color}" data-open="${b.id}"><div class="t">${t}</div><div class="n ell">${esc(b.name||'Без имени')}</div></button>`
              : `<button class="tile free" data-quick="${t}"><div class="t">${t}</div><div class="n">${ic('plus','s')}свободно</div></button>`;
    }).join('')+`</div><div class="muted" style="margin:8px 4px 0">Нажми на свободное время — бронь создастся в 1 клик</div>`;
  }
  const active=list.filter(b=>b.status!=='cancel');
  const sum=active.reduce((s,b)=>s+finalPrice(b),0);

/* ================= Касса ================= */
function periodDates(){
  if(S.cashMode==='day') return [S.date];
  const ym=S.date.slice(0,7); return Object.keys(S.bookings).filter(d=>d.startsWith(ym)).sort();
}
function calcSplit(dates){
  const st=S.settings; const byQ={};
  st.quests.forEach(q=>byQ[q.name]={q,games:0,revenue:0});
  for(const d of dates) for(const b of (S.bookings[d]||[])){
    if(b.status==='cancel') continue;
    const r=byQ[b.quest]||(byQ[b.quest]={q:quest(b.quest),games:0,revenue:0});
    r.games++; r.revenue+=finalPrice(b);
  }
  let tot={games:0,revenue:0,actors:0,base:0,mgmt:st.mgmt.map(m=>({name:m.name,pct:+m.pct||0,sum:0})),owner:0};
  const rows=Object.values(byQ).map(r=>{
    const actors=r.games*(+r.q.actors||0), base=r.revenue-actors;
    const mg=st.mgmt.map(m=>({name:m.name,pct:+m.pct||0,sum:base*(+m.pct||0)/100}));
    const mgSum=mg.reduce((s,m)=>s+m.sum,0), owner=base-mgSum;
    tot.games+=r.games; tot.revenue+=r.revenue; tot.actors+=actors; tot.base+=base; tot.owner+=owner;
    mg.forEach((m,i)=>tot.mgmt[i].sum+=m.sum);
    return {...r,actors,base,mg,mgSum,owner};
  });
  tot.mgSum=tot.mgmt.reduce((s,m)=>s+m.sum,0);
  return {rows,tot};
}
function viewCash(){
  const st=S.settings, dates=periodDates(), {rows,tot}=calcSplit(dates);
  const mgPct=st.mgmt.reduce((s,m)=>s+(+m.pct||0),0);
  let h=`<div class="seg" style="margin-bottom:10px"><button data-cm="day" class="${S.cashMode==='day'?'on':''}">День · ${parseDate(S.date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</button><button data-cm="month" class="${S.cashMode==='month'?'on':''}">${monthName(S.date)}</button></div>`;
  h+=`<div class="card total-card">
    <div class="muted">Выручка за ${S.cashMode==='day'?human(S.date):monthName(S.date).toLowerCase()}</div>
    <div class="big" style="font-size:28px;margin:2px 0 6px">${money(tot.revenue)}</div>
    <div class="sum"><span>Игр</span><b>${tot.games}</b></div>
    <div class="sum"><span>Актёры</span><b>${money(tot.actors)}</b></div>
    <div class="sum"><span>Управление ${mgPct}%</span><b>${money(tot.mgSum)}</b></div>
    ${tot.mgmt.map(m=>`<div class="sum sub" style="color:inherit;opacity:.75"><span>${esc(m.name)} ${m.pct}%</span><b style="color:inherit">${money(m.sum)}</b></div>`).join('')}
    <div class="sum"><span>${esc(st.ownerName)}</span><b class="big" style="font-size:18px">${money(tot.owner)}</b></div>
  </div>`;
  h+=`<h2>По квестам</h2>`;
  for(const r of rows){
    if(!r.games && !st.quests.includes(r.q)) continue;
    h+=`<div class="card"><div class="qhead"><span class="dot" style="background:${r.q.color}"></span>${esc(r.q.name)}<span class="grow"></span><span class="muted">${r.games} ${plural(r.games,'игра','игры','игр')}</span></div>`;
    if(!r.games){ h+=`<div class="muted">Игр не было</div></div>`; continue; }
    h+=`<div class="sum"><span>Выручка</span><b>${money(r.revenue)}</b></div>`;
    if(r.actors) h+=`<div class="sum"><span>Актёры (${r.games} × ${money(r.q.actors)})</span><b class="out">−${money(r.actors)}</b></div><div class="sum"><span>После актёров</span><b>${money(r.base)}</b></div>`;
    h+=`<div class="sum"><span>Управление ${mgPct}%</span><b>${money(r.mgSum)}</b></div>`;
    h+=r.mg.map(m=>`<div class="sum sub"><span>${esc(m.name)} ${m.pct}%</span><b>${money(m.sum)}</b></div>`).join('');
    h+=`<div class="sum"><span>${esc(st.ownerName)}</span><b class="in">${money(r.owner)}</b></div></div>`;
  }
  if(S.cashMode==='day'){
    const rep=S.reports[S.date]||{values:{},note:''};
    h+=`<h2>Касса · приход по способам оплаты</h2><div class="card">`;
    st.payFields.forEach((f,i)=>h+=`<label>${esc(f)}</label><input type="number" inputmode="numeric" id="cp_${i}" value="${esc(rep.values[f]??'')}" placeholder="0" oninput="calcCash()">`);
    h+=`</div><h2>Расходы</h2><div class="card">`;
    st.expenseFields.forEach((f,i)=>h+=`<label>${esc(f)}</label><input type="number" inputmode="numeric" id="ce_${i}" value="${esc(rep.values[f]??'')}" placeholder="0" oninput="calcCash()">`);
    h+=`<label>Комментарий</label><textarea id="c_note" rows="2">${esc(rep.note)}</textarea></div>
    <div class="card" id="cashTotal"></div>
    <button class="btn" data-act="savecash">${ic('save','s')} Сохранить отчёт</button>`;
  }
  h+=`<button class="btn ghost" data-act="share">${ic('send','s')} Отправить отчёт в чат</button>`;
  return h;
}
function readCash(){
  const st=S.settings, values={}; let pin=0,pout=0;
  st.payFields.forEach((f,i)=>{const v=$('cp_'+i)?.value; if(v){values[f]=+v;pin+=+v}});
  st.expenseFields.forEach((f,i)=>{const v=$('ce_'+i)?.value; if(v){values[f]=+v;pout+=+v}});
  return {values,pin,pout,note:$('c_note')?.value||''};
}
function calcCash(){
  const el=$('cashTotal'); if(!el) return;
  const {pin,pout}=readCash(), {tot}=calcSplit([S.date]), diff=pin-tot.revenue;
  el.innerHTML=`<div class="sum"><span>Пришло в кассу</span><b class="in">${money(pin)}</b></div>
    <div class="sum"><span>Расходы</span><b class="out">−${money(pout)}</b></div>
    <div class="sum"><span>Сверка с бронями</span><b class="${diff===0?'in':'out'}">${diff===0?'сходится':(diff>0?'+':'−')+money(Math.abs(diff))}</b></div>
    <div class="sum"><span>Остаток в кассе</span><span class="big">${money(pin-pout)}</span></div>`;
}
function saveCash(silent){
  if(S.cashMode!=='day') return;
  const {values,note}=readCash(); S.reports[S.date]={values,note,saved:Date.now()};
  persist('r_'+S.date,S.reports[S.date]); if(!silent){hapticOk();toast('Отчёт сохранён')}
}
function cashText(){
  const st=S.settings, dates=periodDates(), {rows,tot}=calcSplit(dates);
  let t=`📊 Касса-отчёт · ${S.cashMode==='day'?human(S.date):monthName(S.date)}\n`;
  if(st.admin) t+=`Админ: ${st.admin}\n`;
  t+=`\nИгр: ${tot.games}\nВыручка: ${money(tot.revenue)}\n`;
  for(const r of rows) if(r.games) t+=`  • ${r.q.name}: ${r.games} — ${money(r.revenue)}${r.actors?` (актёры ${money(r.actors)})`:''}\n`;
  t+=`\nАктёры: ${money(tot.actors)}\nУправление: ${money(tot.mgSum)}\n`;
  tot.mgmt.forEach(m=>t+=`  • ${m.name} ${m.pct}%: ${money(m.sum)}\n`);
  t+=`${st.ownerName}: ${money(tot.owner)}\n`;
  if(S.cashMode==='day'){
    const {values,pin,pout,note}=readCash();
    if(pin||pout){ t+=`\nКасса:\n`; [...st.payFields,...st.expenseFields].forEach(f=>{ if(values[f]!=null) t+=`  • ${f}: ${money(values[f])}\n`; }); t+=`Остаток в кассе: ${money(pin-pout)}\n`; }
    if(note) t+=`\n📝 ${note}`;
  }
  return t.trim();
}
function shareCash(){
  saveCash(true); const text=cashText();
  if(tg&&tg.openTelegramLink) tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent('📊')+'&text='+encodeURIComponent(text));

    t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t)); return haptic(); }
  if(d.dt){ editing.discType=d.dt; t.parentNode.querySelectorAll('button').forEach(c=>c.classList.toggle('on',c===t)); previewPrice(); return haptic(); }
  if(d.pay!==undefined){ editing.pay=d.pay; t.parentNode.querySelectorAll('button').forEach(c=>c.classList.toggle('on',c===t)); return haptic(); }
  if(d.st){ editing.status=d.st; t.parentNode.querySelectorAll('button').forEach(c=>c.classList.toggle('on',c===t)); return haptic(); }
  if(d.del){ const p=d.del.split('.'); S.settings[p[0]].splice(+p[1],1); return render(); }
  if(d.add){ const k=d.add; if(k==='quests') S.settings.quests.push({name:'Новый квест',price:0,actors:0,color:QUEST_COLORS[S.settings.quests.length%QUEST_COLORS.length]}); else S.settings[k].push(''); return render(); }
  switch(d.act){
    case 'new': haptic(); return openBooking(null);
    case 'close': return closeSheet();
    case 'save': return saveBooking();
    case 'delete': return deleteBooking();
    case 'pickdate': { const p=$('dpick'); p.value=S.date; try{p.showPicker()}catch(_){p.click()} return; }
    case 'savecash': return saveCash();
    case 'share': return shareCash();

    case 'resetsettings': if(await confirmBox('Сбросить настройки на стандартные?')){ S.settings=clone(DEFAULT_SETTINGS); persist('settings',S.settings); render(); } return;
  }
});

  $('sync').innerHTML=useCloud?ic('cloud','s')+' облако':'';
