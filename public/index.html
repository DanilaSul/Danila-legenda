<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QuestHouse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f3f7);
  --text:var(--tg-theme-text-color,#14161a);
  --hint:var(--tg-theme-hint-color,#8a8f99);
  --accent:var(--tg-theme-button-color,#3478f6);
  --accent-text:var(--tg-theme-button-text-color,#fff);
  --danger:#e5484d; --ok:#22a861; --warn:#e8a01a;
  --line:rgba(128,128,128,.16);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
.i.s{width:16px;height:16px}
header{position:sticky;top:0;z-index:5;background:var(--bg2);padding:12px 16px 4px}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);margin:18px 4px 8px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--hint)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-behavior:smooth}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:48px;text-align:center;padding:7px 0 5px;border-radius:14px;background:var(--bg);font-size:11px;color:var(--hint);border:0;position:relative;transition:background .15s,transform .1s}
.day b{display:block;font-size:18px;color:var(--text);font-weight:700}
.day.on{background:var(--accent);color:var(--accent-text)}
.day.on b{color:var(--accent-text)}
.day.today:not(.on) b{color:var(--accent)}
.day i{display:block;height:4px;width:4px;border-radius:50%;margin:3px auto 0}
.day i.has{background:var(--ok)} .day.on i.has{background:var(--accent-text)}
.day:active,.tile:active,.card.tap:active,.chip:active,.btn:active{transform:scale(.97)}
main{padding:0 16px}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--bg);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;transition:transform .1s}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--hint);font-size:13px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;border:0;background:var(--bg);font-size:14px;font-weight:500;transition:background .15s,color .15s,transform .1s}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--text);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border:0;border-radius:14px;background:var(--bg);padding:10px 10px 9px;text-align:left;min-height:62px;transition:transform .1s,background .15s;border-left:4px solid transparent}
.tile .t{font-weight:700;font-size:16px}
.tile .n{font-size:12px;color:var(--hint);margin-top:2px}
.tile.busy{border-left-color:var(--qc,var(--ok))}
.tile.busy .n{color:var(--text);font-weight:500}
.tile.free .n{display:flex;align-items:center;gap:3px;color:var(--accent)}
.bk{display:flex;gap:12px;align-items:stretch}
.bk .bar{width:4px;border-radius:4px;background:var(--qc)}
.bk .tm{font-weight:800;font-size:17px;min-width:50px}
.price{font-weight:700;white-space:nowrap}
.old{text-decoration:line-through;color:var(--hint);font-size:12px;font-weight:400}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg2);color:var(--hint);white-space:nowrap}
.b-ok{background:rgba(52,120,246,.13);color:var(--accent)}
.b-done{background:rgba(34,168,97,.14);color:var(--ok)}
.b-cancel{background:rgba(229,72,77,.12);color:var(--danger)}
.b-disc{background:rgba(232,160,26,.15);color:var(--warn)}
.cancelled{opacity:.5}
.empty{text-align:center;color:var(--hint);padding:26px 0 10px}
label{display:block;font-size:12px;font-weight:500;color:var(--hint);margin:12px 2px 5px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid transparent;background:var(--bg2);color:var(--text);font:inherit;font-size:16px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hint);transition:background .15s,color .15s}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-text);font-weight:600;font-size:15px;margin-top:12px;transition:transform .1s,opacity .15s}
.btn.ghost{background:var(--bg);color:var(--accent)}
.btn.soft{background:var(--bg2);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--hint);font-size:11px;font-weight:500;padding:4px 0;transition:color .15s}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-text);box-shadow:0 6px 20px rgba(52,120,246,.35);z-index:9;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab .i{width:26px;height:26px;stroke-width:2.4}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden;will-change:transform}
.sheet.open{transform:none;visibility:visible}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h3{flex:1;margin:0;font-size:19px}
.x{border:0;background:var(--bg2);color:var(--hint);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.sum:last-child{border:0}
.sum.sub{padding-left:14px;font-size:14px;color:var(--hint)}
.sum.sub b{color:var(--text);font-weight:600}
.big{font-size:22px;font-weight:800}
.in{color:var(--ok)}.out{color:var(--danger)}
.qhead{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:4px}
.qhead .dot,.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.total-card{background:var(--text);color:var(--bg)}
.total-card .muted{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.total-card .sum{border-color:color-mix(in srgb,var(--bg) 18%,transparent)}
.list-item{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.list-item input{flex:1}
.del{border:0;background:var(--bg2);color:var(--danger);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qset{border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:10px}
.vid{position:relative;overflow:hidden;border-left:5px solid var(--vc)}
.vid .tint{position:absolute;inset:0;background:var(--vc);opacity:.10;pointer-events:none}
.vid.over{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(229,72,77,.35)}}
.cd{font-weight:800;font-size:15px;color:var(--vc);white-space:nowrap}
.prog{height:5px;border-radius:3px;background:var(--bg2);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--vc);border-radius:3px}
.btn.done{background:var(--ok);color:#fff;padding:11px;margin-top:10px}
nav button{position:relative}
.nb{position:absolute;top:0;left:50%;margin-left:6px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;line-height:17px}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mnav b{flex:1;text-align:center;font-size:16px}
.mnav button{border:0;background:var(--bg);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.rep-item{display:flex;align-items:center;gap:12px}
.rep-date{width:46px;height:46px;border-radius:12px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--hint);flex:0 0 auto}
.rep-date b{font-size:17px;color:var(--text);line-height:1}
.tile.custom{border:1.5px dashed var(--line);background:transparent}
.tile.custom .n{color:var(--accent);display:flex;gap:3px;align-items:center}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:rgba(20,22,26,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;gap:6px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<header>
  <div class="top"><h1 class="grow" id="title">Брони</h1><span class="pill" id="sync"></span></div>
  <div class="days" id="days"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="new"><svg class="i"><use href="#i-plus"/></svg></button>
<nav>
  <button data-tab="bookings" class="on"><svg class="i"><use href="#i-cal"/></svg>Брони</button>
  <button data-tab="cash"><svg class="i"><use href="#i-wallet"/></svg>Касса</button>
  <button data-tab="video"><svg class="i"><use href="#i-video"/></svg>Видео<span class="nb" id="vbadge" style="display:none"></span></button>
  <button data-tab="settings"><svg class="i"><use href="#i-sliders"/></svg>Настройки</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input id="dpick" type="date" style="position:fixed;left:-100px;opacity:0">
<input id="tpick" type="time" step="900" style="position:fixed;left:-100px;opacity:0">

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('secondary_bg_color'); tg.setBackgroundColor('secondary_bg_color'); }catch(_){} }
const $ = id => document.getElementById(id);
const ic = (n,c='') => `<svg class="i ${c}"><use href="#i-${n}"/></svg>`;

/* ================= Сервер (общая база) =================
   Всё держим в памяти и рисуем мгновенно, а на сервер отправляем в фоне. */
const INIT = tg ? tg.initData : '';
async function api(method,path,body){
  try{
    const r=await fetch('/api/'+path,{method,headers:{'authorization':'tma '+INIT,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));
    if(!r.ok && method!=='GET'){ toast(r.status===403?'Нет прав':'Ошибка сохранения','x'); setSync('err'); }
    else if(method!=='GET') setSync('ok');
    return {ok:r.ok,status:r.status,data:j};
  }catch(e){ if(method!=='GET'){toast('Нет связи, повторю','x'); setSync('err'); retryQ.push([method,path,body]);} return {ok:false,status:0,data:{}}; }
}
const retryQ=[];
setInterval(async()=>{ if(!retryQ.length) return; const q=retryQ.splice(0); for(const c of q) await api(...c); },10000);
function setSync(st){ const el=$('sync'); if(!el) return; el.innerHTML=st==='err'?`<span style="color:var(--danger)">${ic('cloud','s')} нет связи</span>`:ic('cloud','s')+' синхр.'; }
const can={cashEdit:false,videoDone:false,settings:false};
function setPerms(u){ const own=u.role==='owner'; can.cashEdit=own||!!u.cash_edit; can.videoDone=own||u.role==='video'; can.settings=own; }
const putBooking=b=>{ b.date=b.date||S.date; return api('PUT','booking',b); };

/* ================= Настройки по умолчанию ================= */
const QUEST_COLORS=['#e5484d','#e8a01a','#8e4ec6','#22a861','#3478f6','#0fa3b1'];
const HOURLY=['11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];
const DEFAULT_SETTINGS = {
  v:3,
  quests:[
    {name:'Hell House 2',     price:500000, actors:30000, color:'#e5484d'},
    {name:'Катакомбы',        price:500000, actors:30000, color:'#e8a01a'},
    {name:'Подземелье',       price:400000, actors:0,     color:'#8e4ec6'},
    {name:'Каникулы бабушки', price:400000, actors:0,     color:'#22a861'}
  ],
  slots:HOURLY.slice(),
  defaultGuests:4,
  mgmt:[{name:'Данил',pct:10},{name:'Амир',pct:5}],
  ownerName:'Расова',
  payFields:['Наличные','Карта','Перевод'],
  expenseFields:['Расходы'],
  videoMaker:'Амир',
  videoDays:3,
  notifyBookings:true,
  dailyReport:true,
  dailyTime:'23:30',
  admin:''
};
const STATUSES={new:'Новая',ok:'Подтверждена',done:'Прошла',cancel:'Отмена'};
const STATUS_CLS={new:'',ok:'b-ok',done:'b-done',cancel:'b-cancel'};

let S={tab:'bookings',date:today(),quest:'*',cashView:'list',month:today().slice(0,7),settings:clone(DEFAULT_SETTINGS),bookings:{},reports:{},videos:{},showDone:false};

/* ================= Утилиты ================= */
function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){return fmtDate(new Date())}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)}
function human(s){return parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}
function monthName(ym){const t=parseDate(ym).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}).replace(' г.','');return t[0].toUpperCase()+t.slice(1)}
function money(n){return Math.round(+n||0).toLocaleString('ru-RU')+' сум'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function haptic(t='light'){try{tg.HapticFeedback.impactOccurred(t)}catch(_){}}
function hapticOk(){try{tg.HapticFeedback.notificationOccurred('success')}catch(_){}}
function toast(t,icon='check'){const el=$('toast');el.innerHTML=ic(icon,'s')+esc(t);el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
const quest = name => S.settings.quests.find(q=>q.name===name) || {name,price:0,actors:0,color:'#8a8f99'};
const dayList = d => S.bookings[d] || (S.bookings[d]=[]);
function finalPrice(b){ const p=+b.price||0, d=+b.discount||0; const off=b.discType==='pct'?p*d/100:d; return Math.max(0,Math.round(p-off)); }

/* ================= Лента дней ================= */
function renderDays(){
  const base=new Date(); base.setDate(base.getDate()-7); const t=today(); let h='';
  for(let i=0;i<45;i++){
    const d=new Date(base); d.setDate(base.getDate()+i); const k=fmtDate(d);
    const has=(S.bookings[k]||[]).some(b=>b.status!=='cancel');
    h+=`<button class="day ${k===S.date?'on':''} ${k===t?'today':''}" data-d="${k}">${d.toLocaleDateString('ru-RU',{weekday:'short'})}<b>${d.getDate()}</b><i class="${has?'has':''}"></i></button>`;
  }
  h+=`<button class="day" data-act="pickdate" style="color:var(--accent)">${ic('cal')}<span style="display:block;font-size:11px;margin-top:2px">дата</span></button>`;
  $('days').innerHTML=h;
  const on=$('days').querySelector('.on'); if(on){ const box=$('days'); box.style.scrollBehavior='auto'; box.scrollLeft=on.offsetLeft-box.clientWidth/2+24; box.style.scrollBehavior=''; }
}
function setDate(d){ if(!d) return; S.date=d; haptic(); $('days').querySelectorAll('.day').forEach(b=>b.classList.toggle('on',b.dataset.d===d)); if(!$('days').querySelector('.on')) renderDays(); render(); }

const H=3600e3;
function videoState(v){
  const total=(v.deadline-v.created)||1, left=v.deadline-Date.now(), f=Math.max(0,Math.min(1,left/total));
  const hue=Math.round(120*f); // 120 зелёный → 0 красный
  const color=left<=0?'#e5484d':`hsl(${hue},${70+Math.round((1-f)*15)}%,${42+Math.round(f*0)}%)`;
  let txt;
  if(left<=0){ const o=-left; txt='просрочено на '+(o>=24*H?Math.floor(o/24/H)+' д ':'')+Math.floor(o%(24*H)/H)+' ч'; }
  else { const d=Math.floor(left/24/H), hh=Math.floor(left%(24*H)/H), mm=Math.floor(left%H/6e4); txt=(d?d+' д ':'')+hh+' ч'+(d?'':' '+mm+' мин'); }
  return {f,color,txt,over:left<=0};
}

/* ================= Касса и отчёты ================= */
function calcSplit(dates){
  const st=S.settings; const byQ={};
  st.quests.forEach(q=>byQ[q.name]={q,games:0,revenue:0});
  for(const d of dates) for(const b of (S.bookings[d]||[])){
    if(b.status==='cancel') continue;
    const r=byQ[b.quest]||(byQ[b.quest]={q:quest(b.quest),games:0,revenue:0});
    r.games++; r.revenue+=finalPrice(b);
  }
  let tot={games:0,revenue:0,actors:0,base:0,mgmt:st.mgmt.map(m=>({name:m.name,pct:+m.pct||0,sum:0})),owner:0};
  const rows=Object.values(byQ).map(r=>{
    const actors=r.games*(+r.q.actors||0), base=r.revenue-actors;
    const mg=st.mgmt.map(m=>({name:m.name,pct:+m.pct||0,sum:base*(+m.pct||0)/100}));
    const mgSum=mg.reduce((s,m)=>s+m.sum,0), owner=base-mgSum;
    tot.games+=r.games; tot.revenue+=r.revenue; tot.actors+=actors; tot.base+=base; tot.owner+=owner;
    mg.forEach((m,i)=>tot.mgmt[i].sum+=m.sum);
    return {...r,actors,base,mg,mgSum,owner};
  });
  tot.mgSum=tot.mgmt.reduce((s,m)=>s+m.sum,0);
  return {rows,tot};
}
function cashTotals(rep){
  const st=S.settings; let pin=0,pout=0;
  st.payFields.forEach(f=>pin+=+(rep.values[f]||0)); st.expenseFields.forEach(f=>pout+=+(rep.values[f]||0));
  return {pin,pout};
}

function viewCash(){

function viewReport(d){
  const st=S.settings, rep=S.reports[d]; if(!rep) return `<div class="empty">Отчёта нет</div>`;
  const {rows,tot}=calcSplit([d]), {pin,pout}=cashTotals(rep), diff=pin-tot.revenue;
  let h=`<div class="row" style="margin:0 4px 8px"><b class="grow" style="font-size:17px">Отчёт · ${human(d)}</b><span class="muted">${new Date(rep.saved).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></div>`;
  h+=splitBlock(rows,tot,'Выручка за день');

  [...st.payFields,...st.expenseFields].forEach(f=>{ if(rep.values[f]!=null) h+=`<div class="sum"><span>${st.expenseFields.includes(f)?'− ':''}${esc(f)}</span><b>${money(rep.values[f])}</b></div>`; });
  h+=`<div class="sum"><span>Сверка с бронями</span><b class="${diff===0?'in':'out'}">${diff===0?'сходится':(diff>0?'+':'−')+money(Math.abs(diff))}</b></div>
    <div class="sum"><span>Остаток в кассе</span><span class="big">${money(pin-pout)}</span></div>

  <button class="btn danger" data-act="delrep">${ic('trash','s')} Удалить отчёт</button>`:''}`;
  return h;
}
function readCash(){
  const st=S.settings, values={}; let pin=0,pout=0;
  st.payFields.forEach((f,i)=>{const v=$('cp_'+i)?.value; if(v){values[f]=+v;pin+=+v}});
  st.expenseFields.forEach((f,i)=>{const v=$('ce_'+i)?.value; if(v){values[f]=+v;pout+=+v}});
  return {values,pin,pout,note:$('c_note')?.value||''};
}
function calcCash(){
  const el=$('cashTotal'); if(!el) return;
  const {pin,pout}=readCash(), {tot}=calcSplit([S.date]), diff=pin-tot.revenue;
  el.innerHTML=`<div class="sum"><span>Пришло в кассу</span><b class="in">${money(pin)}</b></div>
    <div class="sum"><span>Расходы</span><b class="out">−${money(pout)}</b></div>
    <div class="sum"><span>Сверка с бронями</span><b class="${diff===0?'in':'out'}">${diff===0?'сходится':(diff>0?'+':'−')+money(Math.abs(diff))}</b></div>
    <div class="sum"><span>Остаток в кассе</span><span class="big">${money(pin-pout)}</span></div>`;
}
function createReport(){
  const {values,note}=readCash(); S.reports[S.date]={values,note,saved:Date.now()};
  api('PUT','report/'+S.date,S.reports[S.date]); hapticOk(); toast('Отчёт создан');
  S.cashView='view'; render(); window.scrollTo(0,0);
}
function reportText(dates,title,rep){
  const st=S.settings, {rows,tot}=calcSplit(dates);
  let t=`📊 Касса-отчёт · ${title}\n`;
  if(st.admin) t+=`Админ: ${st.admin}\n`;
  t+=`\nИгр: ${tot.games}\nВыручка: ${money(tot.revenue)}\n`;
  for(const r of rows) if(r.games) t+=`  • ${r.q.name}: ${r.games} — ${money(r.revenue)}${r.actors?` (актёры ${money(r.actors)})`:''}\n`;
  t+=`\nАктёры: ${money(tot.actors)}\nУправление: ${money(tot.mgSum)}\n`;
  tot.mgmt.forEach(m=>t+=`  • ${m.name} ${m.pct}%: ${money(m.sum)}\n`);
  t+=`${st.ownerName}: ${money(tot.owner)}\n`;
  if(rep){
    const {pin,pout}=cashTotals(rep);
    if(pin||pout){ t+=`\nКасса:\n`; [...st.payFields,...st.expenseFields].forEach(f=>{ if(rep.values[f]!=null) t+=`  • ${f}: ${money(rep.values[f])}\n`; }); t+=`Остаток в кассе: ${money(pin-pout)}\n`; }
    if(rep.note) t+=`\n📝 ${rep.note}`;
  }
  return t.trim();
}

/* ================= Обработчик нажатий (один на всё приложение) ================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open],[data-rep],[data-req],.sheet-bg'); if(!t) return;
  const d=t.dataset;
  if(t.id==='sheetBg') return closeSheet();
  if(d.tab) return go(d.tab);
  if(d.d) return setDate(d.d);
  if(d.q!==undefined){ S.quest=d.q; haptic(); return render(); }
  if(d.quick) return quickAdd(d.quick);
  if(d.open) { haptic(); return openBooking(d.open); }
  if(d.req) { haptic(); return openRequest(d.req); }
  // бронь
  if(d.fq!==undefined){ editing.quest=d.fq; $('f_price').value=quest(d.fq).price; previewPrice(); return segOn(t); }
  if(d.ft) return setEditTime(d.ft);
  if(d.dt){ editing.discType=d.dt; previewPrice(); return segOn(t); }
  if(d.pay!==undefined){ editing.pay=d.pay; return segOn(t); }
  if(d.st){ editing.status=d.st; return segOn(t); }
  // касса
  if(d.cv){ S.cashView=d.cv; haptic(); render(); return window.scrollTo(0,0); }
  if(d.rep){ S.date=d.rep; S.cashView='view'; haptic(); renderDays(); render(); return window.scrollTo(0,0); }
  if(d.mn){ const m=parseDate(S.month); m.setMonth(m.getMonth()+(+d.mn)); S.month=fmtDate(m).slice(0,7); haptic(); return render(); }
  // видео
  if(d.vdone){ const v=S.videos[d.vdone]; v.done=true; v.doneAt=Date.now(); saveVideo(v); hapticOk(); toast('Видео сдано'); return render(); }
  if(d.vundo){ const v=S.videos[d.vundo]; v.done=false; saveVideo(v); return render(); }
  if(d.vedit) return openVideo(d.vedit);
  if(d.vq!==undefined){ vEditing.quest=d.vq; return segOn(t); }
  if(d.vfrom){ const b=dayList(today()).find(x=>x.id===d.vfrom); Object.assign(vEditing,{team:b.name,quest:b.quest,time:b.time,bookingId:b.id,gameDate:today()});
    $('v_team').value=b.name; $('v_quest').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.vq===b.quest)); return segOn(t); }
  if(d.urole){ const [id,role]=d.urole.split(':'); t.style.opacity=.5; await api('PUT','users/'+id,{role,status:'approved'}); hapticOk(); toast('Доступ открыт'); return loadUsers(); }
  if(d.tgl){ const [k,v]=d.tgl.split(':'); S.settings[k]=v==='1'; segOn(t); return; }
  if(d.ucash){ const [id,v]=d.ucash.split(':'); t.style.opacity=.5; await api('PUT','users/'+id,{cash_edit:+v}); hapticOk(); return loadUsers(); }
  if(d.udel){ if(await confirmBox('Убрать сотрудника?')){ await api('DELETE','users/'+d.udel); loadUsers(); } return; }
  // настройки
  if(d.del){ const p=d.del.split('.'); S.settings[p[0]].splice(+p[1],1); return render(); }
  if(d.add){ const k=d.add; if(k==='quests') S.settings.quests.push({name:'Новый квест',price:0,actors:0,color:QUEST_COLORS[S.settings.quests.length%QUEST_COLORS.length]}); else S.settings[k].push(''); return render(); }
  switch(d.act){
    case 'new': haptic(); return S.tab==='video'?openVideo(null):openBooking(null);
    case 'close': return closeSheet();
    case 'save': return saveBooking();
    case 'delete': return deleteBooking();
    case 'customtime': return pickTime(quickAdd);
    case 'ftcustom': return pickTime(setEditTime);
    case 'buyvideo': { const b=collectBooking(); if(!b) return; saveVideo(newVideo(b)); editing=null; closeSheet(); hapticOk(); toast('Видео добавлено в задачи'); return render(); }
    case 'pickdate': { const p=$('dpick'); p.value=S.date; try{p.showPicker()}catch(_){p.click()} return; }
    case 'savecash': return createReport();
    case 'share': return share(reportText([S.date],human(S.date),S.reports[S.date]));
    case 'sharemonth': { const ds=Object.keys(S.reports).filter(x=>x.startsWith(S.month)); return share(reportText(ds,monthName(S.month))); }
    case 'editrep': S.cashView='create'; renderDays(); render(); return window.scrollTo(0,0);
    case 'delrep': if(await confirmBox('Удалить отчёт?')){ delete S.reports[S.date]; api('DELETE','report/'+S.date); S.cashView='list'; render(); } return;
    case 'gtest': { const r=await api('POST','group/test'); return toast(r.ok&&r.data.ok?'Отправлено в группу':'Не получилось', r.data.ok?'check':'x'); }
    case 'gdaily': { const r=await api('POST','group/daily',{date:today()}); return toast(r.ok&&r.data.ok?'Итоги отправлены':'Не получилось', r.data.ok?'check':'x'); }
    case 'goff': if(await confirmBox('Отключить группу?')){ await api('DELETE','group'); loadGroup(); } return;
    case 'grefresh': return loadGroup();
    case 'sendgroup': { t.style.opacity=.5; const r=await api('POST','group/send',{text:reportText([S.date],human(S.date),S.reports[S.date])}); t.style.opacity=1; return r.ok?(hapticOk(),toast('Отправлено в группу')):toast(r.data.error||'Не получилось','x'); }
    case 'rejectreq': if(await confirmBox('Отклонить заявку?')){ const id=editing.requestId; await api('POST','request/'+id+'/reject'); S.requests=(S.requests||[]).filter(x=>x.id!==id); closeSheet(); toast('Заявка отклонена'); render(); } return;
    case 'vsave': return saveVideoForm();
    case 'vdelete': if(await confirmBox('Удалить видео?')){ delete S.videos[vEditing.id]; api('DELETE','video/'+vEditing.id); closeSheet(); render(); } return;
    case 'toggledone': S.showDone=!S.showDone; return render();
    case 'hourly': S.settings.slots=HOURLY.slice(); return render();
    case 'savesettings': return saveSettings();
    case 'resetsettings': if(await confirmBox('Сбросить настройки на стандартные?')){ S.settings=clone(DEFAULT_SETTINGS); api('PUT','settings',S.settings); render(); } return;
  }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.set!==undefined) setPath(t.dataset.set, t.dataset.num!==undefined?(+t.value||0):t.value); });
$('dpick').addEventListener('change',e=>setDate(e.target.value));
setInterval(()=>{ if(S.tab==='video' && !$('sheet').classList.contains('open')) render(); else updateVideoBadge(); },30000);

/* ================= Старт ================= */
let lastSync=0;
function merge(d){
  let changed=false;
  if(d.settings){ S.settings=Object.assign(clone(DEFAULT_SETTINGS),d.settings); changed=true; }
  for(const b of d.bookings||[]){
    changed=true;
    for(const k in S.bookings){ const i=S.bookings[k].findIndex(x=>x.id===b.id); if(i>=0) S.bookings[k].splice(i,1); }
    if(!b._deleted){ delete b._deleted; dayList(b.date).push({status:'new',discount:0,discType:'sum',...b}); }
  }
  for(const r of d.reports||[]){ changed=true; if(r._deleted) delete S.reports[r.date]; else { const {date,_deleted,...rest}=r; S.reports[date]=rest; } }
  for(const v of d.videos||[]){ changed=true; if(v._deleted) delete S.videos[v.id]; else { delete v._deleted; S.videos[v.id]=v; } }
  if(d.me && S.me && (d.me.role!==S.me.role || !!d.me.cash_edit!==!!S.me.cash_edit)){ S.me=d.me; applyRole(); if(!can.settings&&S.tab==='settings') S.tab='bookings'; changed=true; }
  if(d.requests){ const was=JSON.stringify(S.requests||[]); S.requests=d.requests; if(was!==JSON.stringify(d.requests)) changed=true; }
  if(d.t) lastSync=d.t;
  return changed;
}
function busy(){ return $('sheet').classList.contains('open') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)); }
async function sync(){
  if(!S.me) return;
  const r=await api('GET','data?since='+lastSync);
  if(!r.ok){ setSync('err'); return; }
  setSync('ok');
  if(merge(r.data) && !busy()){ renderDays(); render(); }
}
function gate(html){ $('days').style.display='none'; $('fab').style.display='none'; document.querySelector('nav').style.display='none'; $('title').textContent='QuestHouse'; $('view').innerHTML=`<div class="view"><div class="card" style="text-align:center;padding:28px 18px">${html}</div></div>`; }
function applyRole(){
  setPerms(S.me);
  document.querySelector('nav').style.display='flex';
  document.querySelectorAll('nav button').forEach(b=>{ b.style.display=(b.dataset.tab==='settings'&&!can.settings)?'none':''; });
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
}
(async function init(){
  if(!INIT){ return gate(`${ic('cal')}<h3>Откройте через Telegram</h3><div class="muted">Приложение работает внутри бота @QuestHouseBookingBot</div>`); }
  $('view').innerHTML='<div class="empty">Загрузка…</div>';
  const me=await api('GET','me');
  if(!me.ok){ return gate(`<h3>Нет связи с сервером</h3><div class="muted">Попробуйте открыть позже</div>`); }
  S.me=me.data.user;
  if(S.me.status!=='approved'){
    return gate(`${ic('users')}<h3>Ждём подтверждения</h3><div class="muted">Владелец получил запрос и должен открыть вам доступ.<br>Ваш ID: <b>${S.me.tg_id}</b></div><button class="btn" onclick="location.reload()">Проверить ещё раз</button>`);
  }
  const r=await api('GET','data?since=0'); merge(r.data);
  if(!r.data.settings && S.me.role==='owner') api('PUT','settings',S.settings);
  setSync('ok'); applyRole(); renderDays(); render();
  const rq=new URLSearchParams(location.search).get('req');
  if(rq){ if(!(S.requests||[]).find(x=>x.id===rq)){ const g=await api('GET','request/'+rq); if(g.ok&&g.data.request.status==='pending') (S.requests=S.requests||[]).push(g.data.request); }
    if(S.tab!=='bookings') go('bookings'); openRequest(rq); }
  setInterval(sync,15000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) sync(); });
})();
</script>
